# .github/workflows/loadrunner.yml

name: LoadRunner Performance Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Results Folder
        run: |
          New-Item -ItemType Directory -Path "${{ github.workspace }}\results" -Force
          Write-Host "Results folder created"

      - name: Run LoadRunner Scenario
        run: |
          # Start Controller with scenario (without -Run and -Exit)
          $proc = Start-Process `
            -FilePath "C:\Program Files (x86)\Micro Focus\LoadRunner\bin\Wlrun.exe" `
            -ArgumentList "-TestPath `"${{ github.workspace }}\scenarios\01_TransferMoney\gh_Scenario2.lrs`"" `
            -PassThru

          Write-Host "Controller started, PID: $($proc.Id)"
          Write-Host "Waiting for Controller to fully load..."
          Start-Sleep -Seconds 15

          # Send keyboard shortcut to Start the scenario
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SendKeys]::SendWait("%s")
          Start-Sleep -Seconds 2
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")

          Write-Host "Run command sent, waiting for test to complete..."

          # Wait for scenario to finish (adjust seconds to match your test duration)
          Start-Sleep -Seconds 120

          # Close Controller
          Write-Host "Closing Controller..."
          $proc | Stop-Process -Force
          Write-Host "Controller closed"

      - name: Wait for Results to Save
        run: Start-Sleep -Seconds 15

      - name: Copy Results to Workspace
        run: |
          Write-Host "Searching for latest results..."
          $latestResult = Get-ChildItem "C:\Users\vasan" -Recurse -Filter "*.lrr" `
            -ErrorAction SilentlyContinue | `
            Sort-Object LastWriteTime -Descending | `
            Select-Object -First 1

          if ($latestResult) {
            $resultFolder = $latestResult.DirectoryName
            Write-Host "Results found at: $resultFolder"
            Copy-Item -Path "$resultFolder\*" `
              -Destination "${{ github.workspace }}\results\" `
              -Recurse -Force
            Write-Host "Copy complete"
          } else {
            Write-Host "ERROR: No results found!"
            exit 1
          }

      - name: Verify Results
        run: |
          Write-Host "=== Contents of results folder ==="
          Get-ChildItem "${{ github.workspace }}\results" -Recurse -ErrorAction SilentlyContinue

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: lr-results-${{ github.run_number }}
          path: "${{ github.workspace }}/results/"

      - name: Show Results Summary
        run: |
          Write-Host "======================================"
          Write-Host "LoadRunner Test Completed"
          Write-Host "Run Number : ${{ github.run_number }}"
          Write-Host "Scenario   : gh_Scenario2.lrs"
          Write-Host "Results    : lr-results-${{ github.run_number }}"
          Write-Host "======================================"