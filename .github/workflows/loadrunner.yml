# .github/workflows/loadrunner.yml

name: LoadRunner Performance Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run LoadRunner Scenario
        run: |
          & "C:\Program Files (x86)\Micro Focus\LoadRunner\bin\Wlrun.exe" `
            -Run `
            -TestPath "${{ github.workspace }}\scenarios\01_TransferMoney\gh_Scenario2.lrs" `
            -ResultName "result_${{ github.run_number }}" `
            -Exit

      - name: Wait for Results
        run: Start-Sleep -Seconds 10

      - name: Copy Results to results folder
        run: |
          $resultsSource = "C:\TFS\LoadRunner-Training-June\actions-runner\_work\LoadRunner-Training-June\LoadRunner-Training-June\results"
          
          if (Test-Path $resultsSource) {
            Write-Host "Results found at: $resultsSource"
            Get-ChildItem $resultsSource
          } else {
            Write-Host "ERROR: Results folder not found at $resultsSource"
            exit 1
          }

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: lr-results-${{ github.run_number }}
          path: "${{ github.workspace }}/results/"

      - name: Show Results Summary
        run: |
          Write-Host "======================================"
          Write-Host "LoadRunner Test Completed"
          Write-Host "Run Number : ${{ github.run_number }}"
          Write-Host "Scenario   : gh_Scenario2.lrs"
          Write-Host "Results    : lr-results-${{ github.run_number }}"
          Write-Host "======================================"